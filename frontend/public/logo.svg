<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" fill="none">
  <!-- Falcon emblem -->
  <g transform="translate(4, 8)">
    <!-- Body / wing shape -->
    <path d="M28 2 C36 6 44 16 48 28 C50 34 48 40 44 44 C40 48 34 50 28 50 C22 50 16 48 12 44 C8 40 6 34 4 28 C2 22 4 14 8 8 C12 4 20 0 28 2Z"
          fill="#467FC0"/>
    <!-- Head -->
    <circle cx="14" cy="16" r="6" fill="#F4A838"/>
    <!-- Beak -->
    <path d="M8 14 L2 16 L8 18Z" fill="#F4A838"/>
    <!-- Wing accent -->
    <path d="M28 14 C34 18 40 26 44 32 C44 32 38 28 32 22 C28 18 26 16 28 14Z"
          fill="#4595E5"/>
    <!-- Eye -->
    <circle cx="12" cy="15" r="1.5" fill="#09234C"/>
  </g>
  <!-- СОКОЛ text -->
  <text x="64" y="36" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#09234C" letter-spacing="4">СОКОЛ</text>
  <!-- Descriptor -->
  <text x="64" y="56" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#467FC0" letter-spacing="1.5">ЦЕНТР СПОРТИВНЫХ ЕДИНОБОРСТВ</text>
  <!-- Orange accent line -->
  <rect x="64" y="60" width="40" height="2.5" rx="1.25" fill="#F4A838"/>
</svg>
